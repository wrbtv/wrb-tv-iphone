name: Deploy WRB-TV iPhone to Cloudflare Workers

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out WRB-TV iPhone only
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Worker source
        run: |
          node --check src/index.js
          node --check netlify/functions/api.mjs
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const config = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          const manifest = JSON.parse(fs.readFileSync('public/manifest.webmanifest', 'utf8'));
          if (config.name !== 'wrbtv-iphone-pwa-20261016-3858215c') throw new Error('Unexpected Worker name');
          if (config.assets?.directory !== './public') throw new Error('Unexpected assets directory');
          if (!manifest.icons?.length) throw new Error('PWA manifest has no icons');
          if (!fs.existsSync('public/index.html') || !fs.existsSync('public/sw.js') || !fs.existsSync('public/icon.png')) {
            throw new Error('One or more public PWA assets are missing');
          }
          console.log('Cloudflare Worker configuration and PWA assets validated.');
          NODE

      - name: Verify Cloudflare credentials are configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error title=Cloudflare credentials missing::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as Actions secrets in this repository. No Cloudflare deployment was attempted."
            exit 1
          fi

      - name: Confirm the target Worker does not already exist
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -eu
          worker_name="wrbtv-iphone-pwa-20261016-3858215c"
          response_file="$(mktemp)"
          http_code="$(curl --silent --show-error --output "$response_file" --write-out "%{http_code}" \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --header "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$worker_name" || true)"
          if [ "$http_code" = "404" ]; then
            echo "Target Worker was not found; safe to create the isolated deployment."
          elif [ "$http_code" = "200" ]; then
            echo "::error title=Worker name already exists::The target Worker '$worker_name' already exists. Aborting to avoid replacing an existing Cloudflare project."
            exit 1
          else
            echo "::error title=Could not verify Worker is new::Cloudflare returned HTTP $http_code. Aborting without deployment to protect existing projects."
            exit 1
          fi

      - name: Deploy new isolated Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
