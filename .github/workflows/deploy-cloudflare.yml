name: Deploy WRB-TV iPhone to Cloudflare Workers

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'wrangler.jsonc'
      - 'src/**'
      - 'netlify/functions/api.mjs'
      - 'public/**'
      - 'package.json'
      - '.github/workflows/deploy-cloudflare.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out WRB-TV iPhone only
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate direct Worker API configuration
        run: |
          node --check src/index.js
          node --check netlify/functions/api.mjs
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const config = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          const manifest = JSON.parse(fs.readFileSync('public/manifest.webmanifest', 'utf8'));
          const worker = fs.readFileSync('src/index.js', 'utf8');
          if (config.name !== 'wrbtv-iphone-pwa-20261016-3858215c') throw new Error('Unexpected Worker name');
          if (config.assets?.directory !== './public') throw new Error('Unexpected assets directory');
          if (config.containers) throw new Error('No account-wide Containers permission may be required');
          if (!worker.includes('return api(request)')) throw new Error('API must run directly inside the Worker');
          if (!worker.includes('url.pathname === "/health"')) throw new Error('Worker health route missing');
          if (!config.durable_objects?.bindings?.some(b => b.name === 'WRBTV_IPHONE_CONTAINER' && b.class_name === 'WRBTViPhoneNodeContainer')) throw new Error('Preserve original DO binding');
          if (!config.durable_objects?.bindings?.some(b => b.name === 'WRBTV_IPHONE_CONTAINER_V2' && b.class_name === 'WRBTViPhoneNodeContainerV2')) throw new Error('Preserve V2 DO binding');
          for (const name of ['WRBTViPhoneNodeContainer','WRBTViPhoneNodeContainerV2']) {
            if (config.exports?.[name]?.type !== 'durable-object' || config.exports?.[name]?.storage !== 'sqlite') throw new Error('Preserve existing DO namespace ' + name);
          }
          if (config.exports?.WRBTViPhoneNodeContainerV2?.container) throw new Error('Remove Container app association from V2 configuration');
          if (!manifest.icons?.length) throw new Error('PWA manifest has no icons');
          for (const path of ['public/index.html', 'public/sw.js', 'public/icon.png']) {
            if (!fs.existsSync(path)) throw new Error('Missing public PWA asset: ' + path);
          }
          NODE

      - name: Verify Cloudflare credentials are configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error title=Cloudflare credentials missing::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as Actions secrets. No Cloudflare deployment was attempted."
            exit 1
          fi

      - name: Confirm the scoped target is the existing iPhone Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -eu
          worker_name="wrbtv-iphone-pwa-20261016-3858215c"
          response_file="$(mktemp)"
          http_code="$(curl --silent --show-error --output "$response_file" --write-out "%{http_code}" \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --header "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$worker_name" || true)"
          if [ "$http_code" = "200" ]; then
            echo "Specified existing iPhone Worker verified. Only this Worker will be updated."
          elif [ "$http_code" = "404" ]; then
            echo "::error title=Specified iPhone Worker not found::The scoped token can update only the existing iPhone Worker. Aborting without deployment."
            exit 1
          else
            echo "::error title=Could not verify target Worker::Cloudflare returned HTTP $http_code. Aborting without deployment to protect existing projects."
            cat "$response_file"
            exit 1
          fi

      - name: Deploy only the existing iPhone Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
