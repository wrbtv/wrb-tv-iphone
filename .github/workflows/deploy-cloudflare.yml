name: Deploy WRB-TV iPhone to Cloudflare Workers

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'wrangler.jsonc'
      - 'src/**'
      - 'app/**'
      - 'netlify/functions/api.mjs'
      - 'public/**'
      - 'Dockerfile'
      - 'package.json'
      - '.github/workflows/deploy-cloudflare.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out WRB-TV iPhone only
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Worker source
        run: |
          node --check src/index.js
          node --check app/server.mjs
          node --check netlify/functions/api.mjs
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const config = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          const manifest = JSON.parse(fs.readFileSync('public/manifest.webmanifest', 'utf8'));
          if (config.name !== 'wrbtv-iphone-pwa-20261016-3858215c') throw new Error('Unexpected Worker name');
          if (config.assets?.directory !== './public') throw new Error('Unexpected assets directory');
          if (!config.containers?.some(c => c.class_name === 'WRBTViPhoneNodeContainer' && c.image === './Dockerfile')) throw new Error('Original Container for rollback missing');
          const v2Container = config.containers?.find(c => c.name === 'wrbtv-iphone-node-backend-v2' && c.scheduling_policy === 'durable_object' && c.images?.base?.dockerfile === './Dockerfile');
          if (!v2Container || v2Container.class_name) throw new Error('V2 Container must use a single explicit linkage through exports.<class>.container');
          if (config.exports?.WRBTViPhoneNodeContainerV2?.container !== v2Container.name) throw new Error('V2 Container application is not assigned to the Durable Object namespace');
          if (!config.durable_objects?.bindings?.some(b => b.name === 'WRBTV_IPHONE_CONTAINER_V2')) throw new Error('Replacement Container binding missing');
          if (config.migrations) throw new Error('Do not mix exports and migrations');
          if (config.exports?.WRBTViPhoneNodeContainer?.type !== 'durable-object' || config.exports?.WRBTViPhoneNodeContainer?.storage !== 'sqlite') throw new Error('Original Container Durable Object export missing');
          if (config.exports?.WRBTViPhoneNodeContainerV2?.type !== 'durable-object' || config.exports?.WRBTViPhoneNodeContainerV2?.storage !== 'sqlite') throw new Error('Replacement Container Durable Object export missing');
          if (!fs.existsSync('app/server.mjs') || !fs.existsSync('Dockerfile')) throw new Error('Node.js backend files missing');
          if (!manifest.icons?.length) throw new Error('PWA manifest has no icons');
          if (!fs.existsSync('public/index.html') || !fs.existsSync('public/sw.js') || !fs.existsSync('public/icon.png')) {
            throw new Error('One or more public PWA assets are missing');
          }
          console.log('Cloudflare Worker configuration and PWA assets validated.');
          NODE

      - name: Verify Cloudflare credentials are configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error title=Cloudflare credentials missing::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as Actions secrets in this repository. No Cloudflare deployment was attempted."
            exit 1
          fi

      - name: Confirm the target is the dedicated iPhone Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -eu
          worker_name="wrbtv-iphone-pwa-20261016-3858215c"
          response_file="$(mktemp)"
          http_code="$(curl --silent --show-error --output "$response_file" --write-out "%{http_code}" \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --header "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$worker_name" || true)"
          if [ "$http_code" = "404" ]; then
            echo "Dedicated iPhone Worker does not exist yet; deployment will create it."
          elif [ "$http_code" = "200" ]; then
            echo "Dedicated iPhone Worker exists and is the exact target configured by this repository; only this named Worker will be updated."
          else
            echo "::error title=Could not verify target Worker::Cloudflare returned HTTP $http_code. Aborting without deployment to protect existing projects."
            exit 1
          fi

      - name: Deploy new isolated Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
