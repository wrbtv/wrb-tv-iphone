name: Validate WRB-TV iPhone PWA

on:
  push:
    branches: [main, iphone-pwa]
  pull_request:
    branches: [main, iphone-pwa]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check serverless API syntax
        run: node --check netlify/functions/api.mjs
      - name: Check service worker syntax
        run: node --check sw.js
      - name: Check Worker entry point
        run: node --check src/index.js
      - name: Check Node.js Container server
        run: node --check app/server.mjs
      - name: Check public service worker
        run: node --check public/sw.js
      - name: Smoke test Node.js Container API server
        run: |
          set -eu
          node app/server.mjs >/tmp/wrbtv-iphone-node.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          attempt=0
          until curl --fail --silent http://127.0.0.1:3000/health >/tmp/wrbtv-iphone-health.json; do
            attempt=$((attempt + 1))
            if [ "$attempt" -ge 10 ]; then
              cat /tmp/wrbtv-iphone-node.log
              exit 1
            fi
            sleep 1
          done
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const health = JSON.parse(fs.readFileSync('/tmp/wrbtv-iphone-health.json', 'utf8'));
          if (health.ok !== true || health.runtime !== 'nodejs-container' || health.service !== 'wrbtv-iphone-node-backend') {
            throw new Error('Node.js Container health check response invalid');
          }
          console.log('Node.js Container HTTP health check passed.');
          NODE
      - name: Validate PWA assets and Cloudflare deployment guard
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const manifest = JSON.parse(fs.readFileSync('public/manifest.webmanifest', 'utf8'));
          const html = fs.readFileSync('public/index.html', 'utf8');
          const api = fs.readFileSync('netlify/functions/api.mjs', 'utf8');
          const config = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          const deploy = fs.readFileSync('.github/workflows/deploy-cloudflare.yml', 'utf8');
          const worker = fs.readFileSync('src/index.js', 'utf8');
          const nodeServer = fs.readFileSync('app/server.mjs', 'utf8');
          if (manifest.name !== 'WRB-TV' || !manifest.icons?.length) throw new Error('PWA manifest invalid');
          if (!html.includes('apple-mobile-web-app-capable')) throw new Error('iOS install metadata missing');
          if (!html.includes('/manifest.webmanifest')) throw new Error('Manifest link missing');
          if (!html.includes('class="login-hero-logo" src="/icon.png"') || !html.includes('<h1>WRB-TV</h1>')) throw new Error('Official WRB-TV logo/title missing from login');
          if (!html.includes('id="wrbtvFullscreenLogin"') || !html.includes('Adicionar à Tela de Início')) throw new Error('Fullscreen control or iPhone install guidance missing');
          if (!html.includes('wrbtv-screen-controls-visible') || !html.includes("window.addEventListener('pointermove'") || !html.includes("window.addEventListener('pointerdown'")) throw new Error('Fullscreen auto-hide interaction missing');
          if (!api.includes('proxyStreamRequest') || !api.includes('serverPools')) throw new Error('API or stream proxy missing');
          if (!api.includes('"0022": ["http://rekgol.top", "http://aptxu.com"]') || !api.includes('"PFAST": ["http://wrb-tv.top", "http://p1fast.com"]')) throw new Error('Server pools do not match Android/Windows');
          if (!api.includes('HTTP 403')) throw new Error('Upstream 403 handling missing');
          if (!api.includes('IPTVSmartersPro')) throw new Error('Missing IPTV app User-Agent fallback');
          if (!api.includes('function ipToDomain') || !api.includes('sslip.io') || !api.includes('redirect: "manual"')) throw new Error('Android-style stream redirects/IP normalization missing');
          if (worker.includes('GATEWAY_ORIGINS') || worker.includes('forwardRemoteApi') || worker.includes('forwardStream')) throw new Error('iPhone API must not be routed through another Worker');
          if (!worker.includes('getContainer(env.WRBTV_IPHONE_CONTAINER') || !worker.includes('WRBTViPhoneNodeContainer')) throw new Error('Dedicated Node.js Container is not wired into the iPhone Worker');
          if (!nodeServer.includes('nodejs-container') || !nodeServer.includes('api(request)')) throw new Error('Container backend does not serve the project API');
          if (!fs.existsSync('Dockerfile')) throw new Error('Node.js Container Dockerfile missing');
          if (!config.containers?.some(c => c.class_name === 'WRBTViPhoneNodeContainer' && c.image === './Dockerfile')) throw new Error('Dedicated Node.js Container is not configured');
          if (!config.durable_objects?.bindings?.some(b => b.name === 'WRBTV_IPHONE_CONTAINER' && b.class_name === 'WRBTViPhoneNodeContainer')) throw new Error('Container binding missing');
          if (config.name !== 'wrbtv-iphone-pwa-20261016-3858215c') throw new Error('Unexpected isolated Worker name');
          if (config.main !== 'src/index.js' || config.assets?.directory !== './public') throw new Error('Unexpected Worker paths');
          if (!deploy.includes('workflow_dispatch:')) throw new Error('Deployment must stay manually triggered');
          if (!deploy.includes('workers/scripts/$worker_name')) throw new Error('Existing Worker preflight missing');
          if (!deploy.includes('Could not verify target Worker') || !deploy.includes('Aborting without deployment')) throw new Error('Deployment safety abort missing');
          for (const path of ['public/index.html', 'public/sw.js', 'public/icon.png']) {
            if (!fs.existsSync(path)) throw new Error('Missing public asset: ' + path);
          }
          console.log('Cloudflare Worker, safe deploy guard and PWA assets validated.');
          NODE
