name: Validate WRB-TV iPhone PWA

on:
  push:
    branches: [main, iphone-pwa]
  pull_request:
    branches: [main, iphone-pwa]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check API and service worker syntax
        run: |
          node --check netlify/functions/api.mjs
          node --check sw.js
          node --check src/index.js
          node --check public/sw.js

      - name: Install project dependencies
        run: npm install --no-audit --no-fund

      - name: Validate Worker bundle with Wrangler dry run
        run: npx wrangler deploy --dry-run --outdir .wrangler-dry-run

      - name: Smoke test the API directly in the Worker-compatible runtime
        run: |
          node --input-type=module <<'NODE'
          import api from './netlify/functions/api.mjs';

          const options = await api(new Request('https://iphone.example/api', {
            method: 'OPTIONS'
          }));
          if (options.status !== 204) throw new Error('OPTIONS should return HTTP 204');
          if (options.headers.get('access-control-allow-origin') !== '*') throw new Error('CORS header missing');

          const getWithoutStreamUrl = await api(new Request('https://iphone.example/api', {
            method: 'GET'
          }));
          if (getWithoutStreamUrl.status !== 405) throw new Error('Unexpected GET API response');

          const invalidJson = await api(new Request('https://iphone.example/api', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: '{'
          }));
          if (invalidJson.status !== 400) throw new Error('Invalid JSON should return HTTP 400');

          console.log('API OPTIONS, method rejection, and JSON error handling passed.');
          NODE

      - name: Validate isolated Worker, PWA assets and scoped-deploy guard
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const manifest = JSON.parse(fs.readFileSync('public/manifest.webmanifest', 'utf8'));
          const html = fs.readFileSync('public/index.html', 'utf8');
          const api = fs.readFileSync('netlify/functions/api.mjs', 'utf8');
          const config = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          const deploy = fs.readFileSync('.github/workflows/deploy-cloudflare.yml', 'utf8');
          const worker = fs.readFileSync('src/index.js', 'utf8');

          if (manifest.name !== 'WRB-TV' || !manifest.icons?.length) throw new Error('PWA manifest invalid');
          if (!html.includes('apple-mobile-web-app-capable')) throw new Error('iOS install metadata missing');
          if (!html.includes('/manifest.webmanifest')) throw new Error('Manifest link missing');
          if (!html.includes('class="login-hero-logo" src="/icon.png"') || !html.includes('<h1>WRB-TV</h1>')) throw new Error('Official WRB-TV logo/title missing from login');
          if (!html.includes('id="wrbtvFullscreenLogin"') || !html.includes('Adicionar à Tela de Início')) throw new Error('Fullscreen control or iPhone install guidance missing');
          if (!html.includes('wrbtv-screen-controls-visible') || !html.includes("window.addEventListener('pointermove'") || !html.includes("window.addEventListener('pointerdown'")) throw new Error('Fullscreen auto-hide interaction missing');

          if (!api.includes('proxyStreamRequest') || !api.includes('serverPools')) throw new Error('API or stream proxy missing');
          if (!api.includes('"0022": ["http://rekgol.top", "http://aptxu.com"]') || !api.includes('"PFAST": ["http://wrb-tv.top", "http://p1fast.com"]')) throw new Error('Server pools do not match Android/Windows');
          if (!api.includes('IPTVSmartersPro') || !api.includes('sslip.io') || !api.includes('redirect: "manual"')) throw new Error('Stream proxy compatibility features missing');
          if (/^\s*import\s/m.test(api)) throw new Error('API should not depend on external/Node-only imports');

          if (config.name !== 'wrbtv-iphone-pwa-20261016-3858215c') throw new Error('Unexpected Worker name');
          if (config.main !== 'src/index.js' || config.assets?.directory !== './public') throw new Error('Unexpected Worker paths');
          if (config.containers) throw new Error('This deployment must not require account-wide Workers Containers permission');
          if (worker.includes('@cloudflare/containers') || worker.includes('container.start(') || worker.includes('getTcpPort')) throw new Error('Worker request path must not depend on a Container');
          if (!worker.includes('return api(request)')) throw new Error('API is not executed directly by the Worker');
          if (!worker.includes('url.pathname === "/health"')) throw new Error('Worker health endpoint missing');

          // Preserve existing Durable Object declarations without deleting namespaces.
          if (!config.durable_objects?.bindings?.some(b => b.name === 'WRBTV_IPHONE_CONTAINER' && b.class_name === 'WRBTViPhoneNodeContainer')) throw new Error('Original Durable Object binding must be preserved');
          if (!config.durable_objects?.bindings?.some(b => b.name === 'WRBTV_IPHONE_CONTAINER_V2' && b.class_name === 'WRBTViPhoneNodeContainerV2')) throw new Error('V2 Durable Object binding must be preserved');
          for (const name of ['WRBTViPhoneNodeContainer','WRBTViPhoneNodeContainerV2']) {
            if (config.exports?.[name]?.type !== 'durable-object' || config.exports?.[name]?.storage !== 'sqlite') throw new Error('Existing Durable Object namespace must remain declared: ' + name);
          }
          if (config.exports?.WRBTViPhoneNodeContainerV2?.container) throw new Error('V2 namespace must not require a linked Container app');

          if (!deploy.includes('workflow_dispatch:')) throw new Error('Manual deployment trigger missing');
          if (!deploy.includes('workers/scripts/$worker_name')) throw new Error('Target Worker preflight missing');
          if (!deploy.includes('Specified existing iPhone Worker') || !deploy.includes('Aborting without deployment')) throw new Error('Scoped Worker safety guard missing');
          for (const path of ['public/index.html', 'public/sw.js', 'public/icon.png']) {
            if (!fs.existsSync(path)) throw new Error('Missing public asset: ' + path);
          }
          console.log('Worker API, scope safeguards, DO namespace preservation and PWA assets validated.');
          NODE
