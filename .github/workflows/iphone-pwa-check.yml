name: Validate WRB-TV iPhone PWA

on:
  push:
    branches: [main, iphone-pwa]
  pull_request:
    branches: [main, iphone-pwa]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check serverless API syntax
        run: node --check netlify/functions/api.mjs
      - name: Check service worker syntax
        run: node --check sw.js
      - name: Check Worker entry point
        run: node --check src/index.js
      - name: Check public service worker
        run: node --check public/sw.js
      - name: Validate PWA assets and Cloudflare deployment guard
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const manifest = JSON.parse(fs.readFileSync('public/manifest.webmanifest', 'utf8'));
          const html = fs.readFileSync('public/index.html', 'utf8');
          const api = fs.readFileSync('netlify/functions/api.mjs', 'utf8');
          const config = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          const deploy = fs.readFileSync('.github/workflows/deploy-cloudflare.yml', 'utf8');
          const worker = fs.readFileSync('src/index.js', 'utf8');
          if (manifest.name !== 'WRB-TV' || !manifest.icons?.length) throw new Error('PWA manifest invalid');
          if (!html.includes('apple-mobile-web-app-capable')) throw new Error('iOS install metadata missing');
          if (!html.includes('/manifest.webmanifest')) throw new Error('Manifest link missing');
          if (!html.includes('class="login-hero-logo" src="/icon.png"') || !html.includes('<h1>WRB-TV</h1>')) throw new Error('Official WRB-TV logo/title missing from login');
          if (!html.includes('id="wrbtvFullscreenLogin"') || !html.includes('Adicionar à Tela de Início')) throw new Error('Fullscreen control or iPhone install guidance missing');
          if (!html.includes('wrbtv-screen-controls-visible') || !html.includes("window.addEventListener('pointermove'") || !html.includes("window.addEventListener('pointerdown'")) throw new Error('Fullscreen auto-hide interaction missing');
          if (!api.includes('proxyStreamRequest') || !api.includes('serverPools')) throw new Error('API or stream proxy missing');
          if (!api.includes('"0022": ["http://rekgol.top", "http://aptxu.com"]') || !api.includes('"PFAST": ["http://wrb-tv.top", "http://p1fast.com"]')) throw new Error('Server pools do not match Android/Windows');
          if (!api.includes('O servidor de IPTV em') || !api.includes('HTTP 403')) throw new Error('Friendly upstream 403 diagnosis missing');
          if (!worker.includes('wrb-tv-smart-gateway.wrbtv-oficial22.workers.dev') || !worker.includes('wrb-tv-smart-gateway.wrbtv-official22.workers.dev') || !worker.includes('fetchGatewayJson') || !worker.includes('forwardRemoteApi') || !worker.includes('forwardStream')) throw new Error('Persistent Node.js gateway integration missing');
          if (worker.indexOf('wrbtv-oficial22') > worker.indexOf('wrbtv-official22')) throw new Error('Actual account workers.dev hostname must be tried first');
          if (!worker.includes('Never pass that HTML to the app as if it were API JSON')) throw new Error('Gateway non-JSON response must be detected');
          if (!worker.includes('Do not fall back to direct upstream provider requests from this Worker')) throw new Error('Remote codes must stay on the Node.js gateway');
          if (config.name !== 'wrbtv-iphone-pwa-20261016-3858215c') throw new Error('Unexpected isolated Worker name');
          if (config.main !== 'src/index.js' || config.assets?.directory !== './public') throw new Error('Unexpected Worker paths');
          if (!deploy.includes('workflow_dispatch:')) throw new Error('Deployment must stay manually triggered');
          if (!deploy.includes('workers/scripts/$worker_name')) throw new Error('Existing Worker preflight missing');
          if (!deploy.includes('already exists') || !deploy.includes('Aborting')) throw new Error('Deployment safety abort missing');
          for (const path of ['public/index.html', 'public/sw.js', 'public/icon.png']) {
            if (!fs.existsSync(path)) throw new Error('Missing public asset: ' + path);
          }
          console.log('Cloudflare Worker, safe deploy guard and PWA assets validated.');
          NODE
